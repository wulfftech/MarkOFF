<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">

  <!-- Background -->
  <rect width="440" height="280" fill="#6b21a8"/>

  <!-- White circle body — so black stall line art is legible -->
  <circle cx="220" cy="118" r="87" fill="#ffffff"/>

  <!-- Market stall — black line art -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Awning canopy outline -->
    <path d="M 158 102 L 158 72 L 282 72 L 282 102"/>

    <!-- Awning vertical stripes (classic market-stall look) -->
    <line x1="182" y1="72" x2="182" y2="102"/>
    <line x1="206" y1="72" x2="206" y2="102"/>
    <line x1="230" y1="72" x2="230" y2="102"/>
    <line x1="254" y1="72" x2="254" y2="102"/>

    <!-- Awning bottom edge -->
    <line x1="158" y1="102" x2="282" y2="102"/>

    <!-- Valance scallops (3 bumps along awning bottom) -->
    <path d="M 158 102 Q 178 118 198 102 Q 218 118 238 102 Q 258 118 278 102 L 282 102"/>

    <!-- Left support pole -->
    <line x1="170" y1="102" x2="170" y2="150"/>

    <!-- Right support pole -->
    <line x1="270" y1="102" x2="270" y2="150"/>

    <!-- Counter top surface -->
    <path d="M 152 142 L 288 142 L 288 152 L 152 152 Z"/>

    <!-- Counter front apron -->
    <line x1="154" y1="152" x2="286" y2="152"/>

    <!-- Counter legs -->
    <line x1="159" y1="152" x2="159" y2="167"/>
    <line x1="281" y1="152" x2="281" y2="167"/>

    <!-- Products on counter (4 boxes) -->
    <rect x="170" y="129" width="18" height="13" rx="2"/>
    <rect x="196" y="125" width="16" height="17" rx="2"/>
    <rect x="220" y="131" width="15" height="11" rx="2"/>
    <rect x="244" y="127" width="17" height="15" rx="2"/>

  </g>

  <!-- Prohibited sign overlay — purple circle stroke + diagonal line -->
  <circle cx="220" cy="118" r="87" fill="none" stroke="#7c3aed" stroke-width="11"/>

  <!-- Diagonal line clipped to circle interior -->
  <clipPath id="circ">
    <circle cx="220" cy="118" r="84"/>
  </clipPath>
  <line x1="282" y1="56" x2="158" y2="180"
        stroke="#7c3aed" stroke-width="11" stroke-linecap="round"
        clip-path="url(#circ)"/>

  <!-- MarkOFF wordmark -->
  <text x="220" y="240"
        font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif"
        font-size="50" fill="white" text-anchor="middle">
    <tspan font-weight="400">Mark</tspan><tspan font-weight="800">OFF</tspan>
  </text>

  <!-- Tagline -->
  <text x="220" y="266"
        font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif"
        font-size="12" font-weight="500" letter-spacing="1.8"
        fill="#ddd6fe" text-anchor="middle">
    AUSTRALIAN RETAIL. MINUS THE MARKETPLACE.
  </text>

</svg>
